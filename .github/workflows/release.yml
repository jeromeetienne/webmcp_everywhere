name: Release

# Packages the extension and the native messaging host into one folder a person can install
# without cloning anything, proves that folder really works, and attaches it to a GitHub release.
#
# The proof matters more than the packaging. Everything else in this repository runs the host out of
# a working copy, so nothing else would notice a release that cannot start without one.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove_the_release_runs:
    name: Prove a packaged release runs with no repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      archive: ${{ steps.package_it.outputs.archive }}
    steps:
      - name: Take a copy of the repository
        uses: actions/checkout@v7

      - name: Install the oldest Node.js this repository supports
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install the dependencies the lock file names
        run: npm ci

      # First, because everything below is slow and none of it is worth running for a release whose
      # numbers do not agree. A package on npmjs, an extension in chrome://extensions and a tag here
      # that name different versions make every later report about this build unreadable.
      - name: Check the tag, the package and the extension name one version
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npm run check:versions -- "$TAG"

      - name: Check every adapter, then bundle the extension
        run: npm run build

      - name: Package the release
        id: package_it
        run: |
          node tools/webmcp_everywhere/package_release.ts
          echo "archive=build/webmcp_everywhere_release.zip" >> "$GITHUB_OUTPUT"

      # This is the whole point of the job. A runner has no other Chrome on it, so the packaged host
      # can take port 8765, which is what makes this check able to run here and awkward on a laptop
      # where the everyday browser already owns that port.
      - name: Copy the release out of the repository and drive it
        timeout-minutes: 12
        run: node --test tests/webmcp_everywhere/packaged_release.test.ts

      - name: Keep the archive
        uses: actions/upload-artifact@v7
        with:
          name: webmcp_everywhere_release
          path: build/webmcp_everywhere_release.zip

  publish_the_release:
    name: Attach the archive to the release
    needs: prove_the_release_runs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Take the archive the proving job kept
        uses: actions/download-artifact@v8
        with:
          name: webmcp_everywhere_release

      # Nothing is published until the job above has driven the packaged release in a real Chrome, so
      # an archive that cannot start never reaches anybody.
      - name: Attach it to the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            webmcp_everywhere_release.zip

  publish_to_npmjs:
    name: Publish the package to npmjs
    needs: prove_the_release_runs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm reads this to attach provenance, so the tarball on npmjs is traceable to the commit and the
      # workflow run that built it.
      id-token: write
    steps:
      - name: Take a copy of the repository
        uses: actions/checkout@v7

      - name: Install the oldest Node.js this repository supports
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install the dependencies the lock file names
        run: npm ci

      # The package is built again here rather than carried over from the proving job. What stops a
      # broken build reaching npmjs is `needs:` above: this job does not start until that one has driven
      # this same commit's release in a real Chrome. The archive on the GitHub release is still the exact
      # folder that was driven, because that job keeps and attaches it.
      #
      # `packages/webmcp_everywhere/` is the package. Its manifest, its README, its launcher and its host
      # manifest template are committed; the extension folder and the three bundles are what this builds
      # into it. See milestone 3 of https://github.com/jeromeetienne/webmcp_everywhere/issues/11.
      - name: Build the package npm publishes
        run: |
          npm run build
          node tools/webmcp_everywhere/package_release.ts

      - name: Publish it, when there is an account to publish as
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "There is no NPM_TOKEN secret on this repository, so nothing was published to npmjs."
            echo "Set one to publish. The archive on the GitHub release is unaffected."
            exit 0
          fi
          npm publish --workspace webmcp_everywhere --provenance --access public
