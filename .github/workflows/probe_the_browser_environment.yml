name: Probe the browser environment

on:
  workflow_dispatch:
  push:
    branches:
      - probe_the_browser_environment

jobs:
  report:
    name: Report what this runner can do
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Take a copy of the repository
        uses: actions/checkout@v7

      - name: Install the oldest Node.js this repository supports
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install the dependencies the lock file names
        run: npm ci

      - name: Say which Chrome this runner already has
        run: |
          echo "--- which google-chrome ---"
          which google-chrome || echo "no google-chrome on the path"
          which google-chrome-stable || echo "no google-chrome-stable on the path"
          which chromium || echo "no chromium on the path"
          echo "--- versions of whatever is there ---"
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /opt/google/chrome/chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then echo "$candidate -> $("$candidate" --version 2>&1)"; else echo "$candidate absent"; fi
          done

      - name: Build the extension
        run: npm run build

      - name: Report the browser environment
        timeout-minutes: 5
        run: node tools/report_browser_environment.ts

      - name: Run one adapter's live runner, which is what a nightly job would run
        timeout-minutes: 6
        run: node --test tests/site_adapters/todomvc.test.ts

      - name: Run the largest adapter's live runner
        if: always()
        timeout-minutes: 12
        run: node --test tests/site_adapters/openstreetmap.test.ts

      - name: Say whether each adapted site answers this runner at all
        if: always()
        timeout-minutes: 3
        run: |
          for site in https://demo.playwright.dev/todomvc/ https://caniuse.com/ https://www.openstreetmap.org/; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$site" || echo "no answer")
            echo "$site -> $code"
          done

      - name: Load each adapted site in the real Chrome and say what came back
        if: always()
        timeout-minutes: 8
        run: node tools/report_site_reachability.ts
